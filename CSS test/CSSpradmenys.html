<!doctype html>
<html lang="en">
  <head>
    <title>AutoNuoma</title>
    <link rel="stylesheet" href="./Stylepradmenys.css" />
  </head>
  <body>
    <h1 class="pavadinimas">Auto Nuoma</h1>
    <h2>
      Automobilių nuoma Vilniuje, Kaune, Klaipėdoje, Šiauliuose, Panevėžyje,
      Rygoje
    </h2>
    <p>
      Visus turimus/laisvus automobilius galite rezervuoti jau dabar vos per 5
      minutes
    </p>
    <h4>Turimų/Laisvų automobilų sąrašas</h4>
    <form action="CSSpradmenys.html">
      <label for="auto">Pasirinkite automobilo markę:</label>
      <select id="auto" name="auto">
        <option value="Audi">Audi</option>
        <option value="BMW">BMW</option>
        <option value="Maserati">Maserati</option>
        <option value="Skoda">Škoda</option>
        <option value="Volvo">Volvo</option>
        <option value="Porsche">Porsche</option></select
      ><br />
      <label for="modelis">Pasirinkite automobilio modelį:</label>
      <select id="modelis" name="modelis"></select>
    </form>
  </body>
</html>
